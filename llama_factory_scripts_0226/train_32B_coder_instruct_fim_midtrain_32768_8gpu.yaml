### model
model_name_or_path: Qwen/Qwen2.5-Coder-32B-Instruct
trust_remote_code: true
rope_scaling: yarn

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: /data/LLaMA-Factory/examples/deepspeed/ds_z3_config.json

### dataset
dataset: fim_midtrain_data_0226
dataset_dir: /data/LLaMA-Factory/data
template: qwen
cutoff_len: 32768
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16

### output
output_dir: /data/LLaMA-Factory/saves/qwen2-5_coder_32b_fim_midtrain_data_0226_32768_8gpu
logging_steps: 10
resume_from_checkpoint: null
save_steps: 300
plot_loss: true
overwrite_output_dir: false

### train
flash_attn: fa2
# Memory OOM fix: use unsloth gradient checkpointing + allow liger kernels
# (turning liger off makes standard CE allocate huge temporary tensors at 32k).
enable_liger_kernel: true
use_unsloth_gc: true
# use_unsloth_gc: false

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
group_by_length: true

learning_rate: 1.0e-5
weight_decay: 0.05
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### wandb
report_to: none
run_name: FIM-MidTrain-32B-Agent-Coder-0226
